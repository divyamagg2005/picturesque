<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picturesque Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090b09;
        color: #f0efe7;
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 28rem;
        padding: 2rem;
        border: 1px solid rgba(240, 239, 231, 0.12);
        border-radius: 18px;
        background: rgba(12, 16, 13, 0.92);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: #d2d4cf;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Picturesque</h1>
      <p>You are offline. Reconnect to the internet to load pose details, capture guidance, and refresh the camera flow.</p>
    </main>
  </body>
</html>
